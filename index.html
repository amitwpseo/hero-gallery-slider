<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Gallery Slider</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #EFECE6;
            --charcoal: #1F1E1C;
            --gray: #6E6A63;
            --brass: #B08A55;
            --transition-curve: cubic-bezier(0.25, 1, 0.5, 1);
        }

        body {
            width: 100%;
            background-color: var(--bg-color);
            color: var(--charcoal);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 100VH HERO CONTAINER */
        .hero-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem 3rem;
            position: relative;
            background-color: var(--bg-color);
        }

        /* CENTRAL GALLERY STAGE */
        .gallery-stage {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.5rem 0;
        }

        /* 10 ACCORDION VERTICAL PANELS */
        .panel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1450px;
            height: 100%;
            max-height: 500px;
            gap: 12px;
            z-index: 10;
        }

        .gallery-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            filter: grayscale(100%) opacity(0.45);
            transition: flex 0.7s var(--transition-curve),
                        height 0.7s var(--transition-curve),
                        transform 0.7s var(--transition-curve),
                        filter 0.7s var(--transition-curve),
                        opacity 0.7s var(--transition-curve);
            will-change: flex, transform, filter;
        }

        /* Staggered Initial Heights */
        .gallery-panel:nth-child(1) { height: 75%; }
        .gallery-panel:nth-child(2) { height: 82%; }
        .gallery-panel:nth-child(3) { height: 88%; }
        .gallery-panel:nth-child(4) { height: 80%; }
        .gallery-panel:nth-child(5) { height: 95%; }
        .gallery-panel:nth-child(6) { height: 90%; }
        .gallery-panel:nth-child(7) { height: 84%; }
        .gallery-panel:nth-child(8) { height: 78%; }
        .gallery-panel:nth-child(9) { height: 86%; }
        .gallery-panel:nth-child(10) { height: 80%; }

        /* Expanded / Hover State */
        .gallery-panel.active,
        .gallery-panel:hover {
            flex: 4.8;
            height: 100% !important;
            filter: grayscale(0%) opacity(1);
            transform: translateY(-6px);
        }

        .panel-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.06);
            transition: transform 0.8s var(--transition-curve);
        }

        .gallery-panel.active .panel-img,
        .gallery-panel:hover .panel-img {
            transform: scale(1.0);
        }

        /* DYNAMIC EDITORIAL OVERLAY */
        .center-editorial-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            width: 100%;
            max-width: 900px;
        }

        .editorial-sub {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--charcoal);
            opacity: 0.8;
            margin-bottom: 0.2rem;
            font-weight: 500;
        }

        .editorial-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 3.8rem;
            font-weight: 400;
            font-style: italic;
            color: var(--charcoal);
            line-height: 1.05;
            letter-spacing: -0.02em;
            text-shadow: 0 10px 30px rgba(239, 236, 230, 0.9);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .editorial-desc {
            font-size: 0.8rem;
            color: var(--gray);
            margin-top: 0.4rem;
            letter-spacing: 0.05em;
            transition: opacity 0.35s ease;
        }

        .hero-action-group {
            margin-top: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            pointer-events: auto;
        }

        .btn-primary-hero {
            padding: 0.7rem 1.8rem;
            background-color: var(--charcoal);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(31,30,28,0.15);
        }

        .btn-primary-hero:hover {
            background-color: var(--brass);
            transform: translateY(-2px);
        }

        .btn-secondary-hero {
            padding: 0.7rem 1.8rem;
            background-color: transparent;
            color: var(--charcoal);
            text-decoration: none;
            border-radius: 50px;
            border: 1px solid rgba(31,30,28,0.3);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .btn-secondary-hero:hover {
            border-color: var(--brass);
            color: var(--brass);
            transform: translateY(-2px);
        }

        .text-out {
            opacity: 0;
            transform: translateY(8px);
        }

        /* HUD CONTROLS & FOOTER */
        footer.hero-footer {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--gray);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            z-index: 50;
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--charcoal);
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 4px;
        }

        .nav-btn:hover {
            color: var(--brass);
        }

        @media (max-width: 1024px) {
            .hero-viewport { padding: 1.5rem; }
            .editorial-title { font-size: 2.4rem; }
            .panel-container { gap: 6px; }
        }
    </style>
</head>
<body>

    <div class="hero-viewport">
        <!-- GALLERY VIEWPORT -->
        <main class="gallery-stage">
            
            <!-- FLOATING EDITORIAL OVERLAY -->
            <div class="center-editorial-overlay">
                <div class="editorial-sub" id="active-category">Kitchen Architecture &bull; Project 01</div>
                <h1 class="editorial-title" id="active-title">Luxury Kitchen</h1>
                <p class="editorial-desc" id="active-desc">Book-matched Calacatta marble with custom white oak architectural cabinetry.</p>
                
                <div class="hero-action-group">
                    <a href="#" class="btn-primary-hero">Explore Work</a>
                    <a href="#" class="btn-secondary-hero">Start Project</a>
                </div>
            </div>

            <!-- 10 INTERACTIVE SLIDER PANELS -->
            <div class="panel-container" id="panel-gallery">
                <div class="gallery-panel active" data-index="0" data-category="Kitchen Architecture" data-title="Luxury Kitchen" data-desc="Book-matched Calacatta marble with custom white oak architectural cabinetry.">
                    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=85" alt="Luxury Kitchen" class="panel-img" />
                </div>

                <div class="gallery-panel" data-index="1" data-category="Minimalist Design" data-title="Modern Kitchen" data-desc="Matte charcoal cabinetry paired with cantilevered quartzite waterfall island.">
                    <img src="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=1200&q=85" alt="Modern Kitchen" class="panel-img" />
                </div>

                <div class="gallery-panel" data-index="2" data-category="Classic Living" data-title="Transitional Kitchen" data-desc="Modern shaker profiles with greige finish and unlacquered brass accents.">
                    <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae?auto=format&fit=crop&w=1200&q=85" alt="Transitional Kitchen" class="panel-img" />
                </div>

                <div class="gallery-panel" data-index="3" data-category="Custom Joinery" data-title="Custom Cabinetry" data-desc="Engineered pocket door pantries and bespoke fluted oak wall paneling.">
                    <img src="https://images.unsplash.com/photo-1565538810643-b5bdb714032a?auto=format&fit=crop&w=1200&q=85" alt="Custom Cabinetry" class="panel-img" />
                </div>

                <div class="gallery-panel" data-index="4" data-category="Private Sanctuary" data-title="Spa Bathroom" data-desc="Freestanding concrete soaking tub surrounded by honed Travertine wall slabs.">
                    <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=1200&q=85" alt="Spa Bathroom" class="panel-img" />
                </div>

                <div class="gallery-panel" data-index="5" data-category="Wellness Wet Room" data-title="Modern Bathroom" data-desc="Zero-threshold curbless walk-in shower with integrated ceiling rain head.">
                    <img src="https://images.unsplash.com/photo-1620626011761-996317b8d101?auto=format&fit=crop&w=1200&q=85" alt="Modern Bathroom" class="panel-img" />
                </div>

                <div class="gallery-panel" data-index="6" data-category="Master Enclosure" data-title="Master Suite" data-desc="Dual oak vanities set against dramatic Nero Marquina black marble wall.">
                    <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1200&q=85" alt="Master Suite" class="panel-img" />
                </div>

                <div class="gallery-panel" data-index="7" data-category="Sculptural Detail" data-title="Custom Vanity" data-desc="Solid carved stone block basin with wall-mounted patinaed brass fixtures.">
                    <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=1200&q=85" alt="Custom Vanity" class="panel-img" />
                </div>

                <div class="gallery-panel" data-index="8" data-category="Natural Geology" data-title="Tile &amp; Stone" data-desc="Handcrafted Moroccan zellige ceramic tiles paired with honed Taj Mahal quartzite.">
                    <img src="https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=1200&q=85" alt="Tile & Stone" class="panel-img" />
                </div>

                <div class="gallery-panel" data-index="9" data-category="Cohesive Architecture" data-title="Full Interior" data-desc="Seamless spatial flow connecting culinary zones with luxury bath quarters.">
                    <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1200&q=85" alt="Full Interior" class="panel-img" />
                </div>
            </div>
        </main>

        <!-- FOOTER / NAV CONTROLS -->
        <footer class="hero-footer">
            <div>SEE ALL 10 FEATURED PROJECTS</div>
            <div>AURA ARCHITECTURAL INTERIORS &bull; 2026</div>
            <div class="controls-wrapper">
                <button class="nav-btn" id="prev-btn" aria-label="Previous">&larr;</button>
                <button class="nav-btn" id="next-btn" aria-label="Next">&rarr;</button>
            </div>
        </footer>
    </div>

    <!-- CONTROLLER SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const panels = document.querySelectorAll('.gallery-panel');
            const activeCategory = document.getElementById('active-category');
            const activeTitle = document.getElementById('active-title');
            const activeDesc = document.getElementById('active-desc');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            let currentIndex = 0;

            function updateOverlayText(panel) {
                const index = parseInt(panel.getAttribute('data-index'), 10);
                currentIndex = index;

                const category = panel.getAttribute('data-category');
                const title = panel.getAttribute('data-title');
                const desc = panel.getAttribute('data-desc');

                activeTitle.classList.add('text-out');
                activeDesc.style.opacity = '0';

                setTimeout(() => {
                    activeCategory.textContent = `${category} \u2022 Project ${(index + 1).toString().padStart(2, '0')}`;
                    activeTitle.textContent = title;
                    activeDesc.textContent = desc;

                    activeTitle.classList.remove('text-out');
                    activeDesc.style.opacity = '1';
                }, 180);
            }

            function setActivePanel(targetPanel) {
                panels.forEach(p => p.classList.remove('active'));
                targetPanel.classList.add('active');
                updateOverlayText(targetPanel);
            }

            // Hover and Click Triggers
            panels.forEach(panel => {
                panel.addEventListener('mouseenter', () => setActivePanel(panel));
                panel.addEventListener('click', () => setActivePanel(panel));
            });

            // Arrow Navigation Controls
            prevBtn.addEventListener('click', () => {
                let newIndex = currentIndex - 1;
                if (newIndex < 0) newIndex = panels.length - 1;
                setActivePanel(panels[newIndex]);
            });

            nextBtn.addEventListener('click', () => {
                let newIndex = currentIndex + 1;
                if (newIndex >= panels.length) newIndex = 0;
                setActivePanel(panels[newIndex]);
            });
        });
    </script>
</body>
</html>
